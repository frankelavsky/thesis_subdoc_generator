# variants.conf — one variant per line.
#
# Format:   name = part1, part2, part3, ...
# Parts:
#   title, keywords, abstract, acknowledgements, toc,
#   bio, references, discussion,
#   N        (full chapter, e.g. 1, 2, 9)
#   N.M      (chapter N, intro + section M only, e.g. 9.1)
#             multiple N.M for the same N are combined
#   all      (everything — this variant will NOT get a cover page)
#
#   Reference:
#   4  - Chartability
#   5  - Data Navigator
#   6  - Skeleton
#   7  - Cross-perception
#   8  - Softerware
#   9  - Findings  (NEW: 9.1 barriers produced, 9.2 tools reduce work,
#                        9.3 invisible→visible, 9.4 friction productive,
#                        9.5 tool-use generative, 9.6 substrate barriers,
#                        9.7 what tool-making did not do)
#   10 - Discussion & Future Work  (was Ch 9 before the Findings chapter was added;
#                        10.1 what is a tool, 10.2 applied accessibility,
#                        10.3 who is responsible for repair)
# Any variant whose parts list does not contain "all" gets a cover page
# added as its first page (with the archival URL and a contents summary).
#
# Tip: include "references" in any abridged variant that cites things,
# otherwise \cite{...} commands will render as "?".

2026-elavsky-dissertation = all

2026-thesis-personal = title, acknowledgements, bio, references

# Committee preview: full front matter + introductory arc + both conclusion chapters
2026-thesis-committee_preview = title, keywords, abstract, toc, 1, 2, 3, 9, 10, references

# Toolmakers: intro + findings on tool agency + discussion on what a tool is and repair
2026-thesis-toolmaker = 1, 9.2, 9.4, 9.5, 10.1, 10.3, references

# Visualization practitioners: Skeleton + Softerware + findings on invisible structure
# and limitations + discussion on tools and repair
2026-thesis-visualization = toc, 1, 6, 8, 9.3, 9.7, 10.1, 10.3, references

# Accessibility practitioners: Chartability + Skeleton + findings on barriers and substrate
2026-thesis-accessibility = toc, 1, 4, 6, 9.1, 9.2, 9.6, 10.2, 10.3, references

# Researchers wanting a quick overview: abstract + contributions + key finding + repair section
2026-thesis-researcher = abstract, 3, 9.7, 10.3, references

